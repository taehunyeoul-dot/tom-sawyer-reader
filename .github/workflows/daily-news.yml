name: 매일 NASA 기사 받아 앱에 반영

# 매일 한국 시간 아침 7시(UTC 22:00)에 돈다.
# 필요할 때 Actions 탭에서 "Run workflow" 로 직접 돌릴 수도 있다.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '받아올 기사 수'
        required: false
        default: '3'

permissions:
  contents: write

# 두 번이 겹쳐 돌면 서로의 push 를 밀어내 실패한다. 한 번에 하나만 돌린다.
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # spaCy 설치는 오래 걸리므로 캐시해 둔다
      - name: 파이썬 패키지 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-spacy-${{ runner.os }}-v1

      - name: spaCy 설치
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet spacy
          python -m spacy download en_core_web_sm

      - name: 기사 받기
        run: python scripts/12_fetch_nasa.py ${{ github.event.inputs.count || 3 }}

      - name: 학습 자료로 가공
        run: python scripts/13_build_news.py

      - name: 앱 다시 만들기
        run: python scripts/08_build_reader.py

      # 사람이 같은 시각에 커밋을 올리면 push 가 밀린다(2026-09-01 실제로 실패).
      # 밀리면 받아서 얹은 뒤 다시 시도하고, 이미 올라가 있으면 성공으로 본다.
      - name: 바뀐 것이 있으면 올리기
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/news_src data/news.json data/news_unknown.json index.html sw.js
          if git diff --cached --quiet; then
            echo "새 기사가 없습니다. 그대로 둡니다."
            exit 0
          fi
          git commit -m "매일 NASA 기사 갱신 ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            if git push; then
              echo "올렸습니다."
              exit 0
            fi
            echo "push 가 밀렸습니다 — 받아서 다시 시도합니다 ($i/3)"
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          # 여기까지 왔어도, 내 커밋이 이미 원격에 들어가 있으면 성공이다
          # (push 는 서버에 반영됐는데 응답만 실패로 온 경우가 있다)
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "이미 원격에 반영돼 있습니다."
            exit 0
          fi
          echo "끝내 올리지 못했습니다."
          exit 1
