name: 매일 NASA 기사 받아 앱에 반영

# 매일 한국 시간 아침 7시(UTC 22:00)에 돈다.
# 필요할 때 Actions 탭에서 "Run workflow" 로 직접 돌릴 수도 있다.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '받아올 기사 수'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # spaCy 설치는 오래 걸리므로 캐시해 둔다
      - name: 파이썬 패키지 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-spacy-${{ runner.os }}-v1

      - name: spaCy 설치
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet spacy
          python -m spacy download en_core_web_sm

      - name: 기사 받기
        run: python scripts/12_fetch_nasa.py ${{ github.event.inputs.count || 3 }}

      - name: 학습 자료로 가공
        run: python scripts/13_build_news.py

      - name: 앱 다시 만들기
        run: python scripts/08_build_reader.py

      - name: 바뀐 것이 있으면 올리기
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/news_src data/news.json data/news_unknown.json index.html sw.js
          if git diff --cached --quiet; then
            echo "새 기사가 없습니다. 그대로 둡니다."
          else
            git commit -m "매일 NASA 기사 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
